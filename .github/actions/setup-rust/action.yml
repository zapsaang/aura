name: Setup Rust
description: Install Linux CI packages, Rust toolchain, and Cargo cache.

inputs:
  toolchain:
    description: Rust toolchain to install (for example 1.85.0 or 1.70.0).
    required: true
  targets:
    description: Comma-separated Rust compilation targets to add.
    required: false
    default: ''
  components:
    description: Rust toolchain components to install.
    required: false
    default: ''
  extra-apt-packages:
    description: Additional Linux packages to install with the shared CI packages.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Init env
      if: runner.os == 'Linux'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        EXTRA_APT_PACKAGES: ${{ inputs.extra-apt-packages }}
      run: |
        echo 'DPkg::Post-Invoke { "rm -f /var/lib/dpkg/triggers/* 2>/dev/null || true"; };' \
          | sudo tee /etc/apt/apt.conf.d/99no-triggers > /dev/null
        echo 'DPkg::TriggersPending "false";' \
          | sudo tee -a /etc/apt/apt.conf.d/99no-triggers > /dev/null

        sudo -E apt-get -qq update

        sudo -E apt-get install -y --no-install-recommends \
          build-essential \
          libssl-dev \
          pkg-config \
          ${EXTRA_APT_PACKAGES}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
