name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          extra-apt-packages: |
            protobuf-compiler
            libacl1-dev

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-common:
    name: test-aura-common
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: cargo test -p aura-common
        run: cargo test -p aura-common

  test-daemon:
    name: test-aura-daemon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: cargo test -p aura-daemon
        run: cargo test -p aura-daemon

  test-cli:
    name: test-aura-cli
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: cargo test -p aura-cli
        run: cargo test -p aura-cli

  test-workspace:
    name: test-workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: cargo test --workspace
        env:
          RUST_BACKTRACE: 1
        run: cargo test --workspace

  test-release:
    name: test-release-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: cargo test --workspace --release
        env:
          RUST_BACKTRACE: 1
        run: cargo test --workspace --release

  test-macos:
    name: test-macos
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: cargo test --workspace
        env:
          RUST_BACKTRACE: 1
        run: cargo test --workspace
