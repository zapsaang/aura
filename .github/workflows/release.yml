name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  release-linux-x86:
    name: release-linux-x86
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.85.0'
          targets: x86_64-unknown-linux-gnu

      - name: release-linux-x86-build
        run: cargo +1.85.0 build --workspace --release --locked --target x86_64-unknown-linux-gnu --features aura-daemon/gpu-nvml

      - name: release-linux-x86-package
        run: python3 scripts/package-release.py --target x86_64-unknown-linux-gnu --input target/x86_64-unknown-linux-gnu/release --output aura-x86_64-unknown-linux-gnu.tar.gz

      - name: release-smoke-linux-native
        run: python3 scripts/smoke-release.py --archive aura-x86_64-unknown-linux-gnu.tar.gz --platform linux --evidence .omo/evidence/design-compliance-remediation/lane/release-linux-x86/artifacts/release-smoke-linux-native

      - name: Checksum and upload
        run: |
          shasum -a 256 aura-x86_64-unknown-linux-gnu.tar.gz > aura-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-x86_64-unknown-linux-gnu
          path: |
            aura-x86_64-unknown-linux-gnu.tar.gz
            aura-x86_64-unknown-linux-gnu.tar.gz.sha256

  release-linux-arm64:
    name: release-linux-arm64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.85.0'

      - name: t15-02 (install exact cross)
        run: cargo +1.85.0 install cross --version 0.2.5 --locked && test "$(cross --version)" = 'cross 0.2.5'

      - name: release-linux-arm64-build
        run: RUSTUP_TOOLCHAIN=1.85.0 cross build --workspace --release --locked --target aarch64-unknown-linux-gnu --features aura-daemon/gpu-nvml

      - name: release-linux-arm64-package
        run: python3 scripts/package-release.py --target aarch64-unknown-linux-gnu --input target/aarch64-unknown-linux-gnu/release --output aura-aarch64-unknown-linux-gnu.tar.gz

      - name: release-linux-arm64-elf
        run: python3 scripts/verify-release-binary.py --platform linux --arch aarch64 --archive aura-aarch64-unknown-linux-gnu.tar.gz --forbid-import 'nvidia-ml|nvml'

      - name: Checksum and upload
        run: |
          shasum -a 256 aura-aarch64-unknown-linux-gnu.tar.gz > aura-aarch64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-aarch64-unknown-linux-gnu
          path: |
            aura-aarch64-unknown-linux-gnu.tar.gz
            aura-aarch64-unknown-linux-gnu.tar.gz.sha256

  release-macos-arm64:
    name: release-macos-arm64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.85.0'
          targets: aarch64-apple-darwin

      - name: release-macos-arm64-build
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: MACOSX_DEPLOYMENT_TARGET=12.0 cargo +1.85.0 build --workspace --release --locked --target aarch64-apple-darwin

      - name: release-macos-arm64-package
        run: python3 scripts/package-release.py --target aarch64-apple-darwin --input target/aarch64-apple-darwin/release --output aura-aarch64-apple-darwin.tar.gz

      - name: release-smoke-macos-native
        run: python3 scripts/smoke-release.py --archive aura-aarch64-apple-darwin.tar.gz --platform macos --evidence .omo/evidence/design-compliance-remediation/lane/release-macos-arm64/artifacts/release-smoke-macos-native

      - name: release-macos-arm64-minos
        run: python3 scripts/verify-release-binary.py --platform macos --archive aura-aarch64-apple-darwin.tar.gz --minos 12.0

      - name: Checksum and upload
        run: |
          shasum -a 256 aura-aarch64-apple-darwin.tar.gz > aura-aarch64-apple-darwin.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-aarch64-apple-darwin
          path: |
            aura-aarch64-apple-darwin.tar.gz
            aura-aarch64-apple-darwin.tar.gz.sha256

  release-macos-x86:
    name: release-macos-x86
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.85.0'
          targets: x86_64-apple-darwin

      - name: release-macos-x86-build
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: MACOSX_DEPLOYMENT_TARGET=12.0 cargo +1.85.0 build --workspace --release --locked --target x86_64-apple-darwin

      - name: release-macos-x86-package
        run: python3 scripts/package-release.py --target x86_64-apple-darwin --input target/x86_64-apple-darwin/release --output aura-x86_64-apple-darwin.tar.gz

      - name: release-macos-x86-file
        run: python3 scripts/verify-release-binary.py --platform macos --arch x86_64 --archive aura-x86_64-apple-darwin.tar.gz

      - name: release-macos-x86-minos
        run: python3 scripts/verify-release-binary.py --platform macos --archive aura-x86_64-apple-darwin.tar.gz --minos 12.0

      - name: release-macos-x86-imports
        run: python3 scripts/verify-release-binary.py --platform macos --archive aura-x86_64-apple-darwin.tar.gz --forbid-import 'nvidia-ml|nvml'

      - name: Checksum and upload
        run: |
          shasum -a 256 aura-x86_64-apple-darwin.tar.gz > aura-x86_64-apple-darwin.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-x86_64-apple-darwin
          path: |
            aura-x86_64-apple-darwin.tar.gz
            aura-x86_64-apple-darwin.tar.gz.sha256

  homebrew-render:
    name: homebrew-render
    needs:
      - release-linux-x86
      - release-linux-arm64
      - release-macos-arm64
      - release-macos-x86
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require canonical tag resolving to this commit
        run: |
          echo "$TAG" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "${{ github.sha }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: homebrew-render
        env:
          TAG: ${{ env.TAG }}
        run: |
          SHA_LINUX_X86=$(shasum -a 256 artifacts/aura-x86_64-unknown-linux-gnu/aura-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          SHA_LINUX_ARM=$(shasum -a 256 artifacts/aura-aarch64-unknown-linux-gnu/aura-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          SHA_MACOS_ARM=$(shasum -a 256 artifacts/aura-aarch64-apple-darwin/aura-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_MACOS_X86=$(shasum -a 256 artifacts/aura-x86_64-apple-darwin/aura-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          python3 scripts/render-homebrew-formula.py \
            --tag "$TAG" \
            --linux-x86 "$SHA_LINUX_X86" \
            --linux-arm "$SHA_LINUX_ARM" \
            --macos-arm "$SHA_MACOS_ARM" \
            --macos-x86 "$SHA_MACOS_X86" \
            --out dist/homebrew/aura.rb

      - name: homebrew-ruby-syntax
        run: ruby -c dist/homebrew/aura.rb

      - name: Record formula SHA-256
        run: shasum -a 256 dist/homebrew/aura.rb | awk '{print $1}' > dist/homebrew/aura.rb.sha256

      - name: Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: |
            dist/homebrew/aura.rb
            dist/homebrew/aura.rb.sha256

  homebrew-audit:
    name: homebrew-audit
    needs:
      - homebrew-render
    runs-on: macos-15

    steps:
      - name: Download formula artifact
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: dist/homebrew

      - name: homebrew-audit
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          SHA_FORMULA=$(cat dist/homebrew/aura.rb.sha256)
          test "$(shasum -a 256 dist/homebrew/aura.rb | awk '{print $1}')" = "$SHA_FORMULA"
          HOMEBREW_NO_AUTO_UPDATE=1 brew audit --strict --formula dist/homebrew/aura.rb
