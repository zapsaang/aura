[workspace]
resolver = "2"
members = [
    "aura-common",
    "aura-daemon",
    "aura-cli",
]

[workspace.package]
version = "1.0.5"
edition = "2021"
rust-version = "1.70"
authors = ["AURA Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zapsaang/aura"

[workspace.dependencies]

# Memory mapping
memmap2 = "=0.9.4"

# Atomic operations
crossbeam-epoch = "=0.9.18"

# Error handling
thiserror = "=1.0.69"
anyhow = "=1.0.86"

# Logging
log = "=0.4.22"
env_logger = "=0.10.2"

# CLI argument parsing
clap = { version = "=4.4.18", features = ["derive"] }

# Time (timezone support)
time = { version = "=0.3.36", features = ["formatting", "parsing", "macros"] }

# NVML (GPU) - runtime-loaded via libloading, Linux only
nvml-wrapper = "=0.12.1"

# CRC32 for checksum
crc32fast = "=1.4.2"

# OS interfaces
libc = "=0.2.158"

# Zero-copy serialization
bytemuck = { version = "=1.16.3", features = ["derive", "min_const_generics"] }

# Serialization
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"

# Test and benchmark support
rand = "=0.8.5"
serial_test = "=3.1.1"
tempfile = "=3.12.0"
criterion = { version = "=0.5.1", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
